# Single-service compose: the app talks to a hosted Supabase project for both
# database and auth, so there's no local Postgres to wire up. To run a fully
# local stack instead, swap NEXT_PUBLIC_SUPABASE_URL to the Supabase CLI's
# `supabase start` URL.
services:
  web:
    build: .
    image: tournament-manager-nextjs:latest
    container_name: tournament-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
